# NetBeans Project Properties for TARUMT Clinic Management System

# Application Configuration
application.title=TARUMT-ClinicManagementSystem
application.vendor=TARUMT Student
main.class=main.ClinicManagementSystem

# Build Configuration
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results

# Source and Compilation
src.dir=.
excludes=
includes=**
jar.compress=false
javac.classpath=
javac.compilerargs=-Xlint:all
javac.deprecation=false
javac.external.vm=true
javac.processorpath=${javac.classpath}
javac.source=20
javac.target=20
javac.test.classpath=${javac.classpath}:${build.classes.dir}
javac.test.processorpath=${javac.test.classpath}

# Distribution
dist.dir=dist
dist.jar=${dist.dir}/TARUMT-ClinicManagementSystem.jar
dist.javadoc.dir=${dist.dir}/javadoc

# Documentation
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=TARUMT Clinic Management System

# Runtime Configuration
run.classpath=${javac.classpath}:${build.classes.dir}
run.jvmargs=-Dfile.encoding=UTF-8
run.test.classpath=${javac.test.classpath}:${build.test.classes.dir}

# Platform Configuration
platform.active=default_platform
source.encoding=UTF-8

# File Patterns
file.reference.TARUMT-ClinicManagementSystem-src=.
